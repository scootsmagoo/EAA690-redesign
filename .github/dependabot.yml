version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Packages that share a peer-dependency contract must bump together, or
      # npm refuses to install (e.g. @fullcalendar/core 7 vs daygrid 6 peers).
      fullcalendar:
        patterns: ['@fullcalendar/*']
      sanity:
        patterns: ['sanity', '@sanity/*', 'next-sanity', '@portabletext/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      next:
        patterns: ['next', 'eslint-config-next']
      # Auth gets its own PR, never bundled: a bad bump locks every member out,
      # so it must be reviewable and revertable on its own. CI's auth-upgrade
      # job is the gate for these PRs — do not merge one while it is red.
      auth:
        patterns: ['better-auth', '@better-auth/*']
      # Everything else: one PR per week for routine minor/patch bumps; majors
      # arrive individually so their changelogs get read.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Auth library: patch releases only via Dependabot; minors/majors are
      # deliberate upgrades that require reading the migration guide first
      # (see the better-auth 1.7 incident).
      - dependency-name: better-auth
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Majors that are blocked upstream or need a real migration. Dependabot
      # reopened them weekly and CI (correctly) failed every time. Remove an
      # entry when its condition is met, then do the upgrade deliberately.
      #  - better-sqlite3 13: better-auth 1.7.x peers on better-sqlite3 ^12, so
      #    `npm ci` cannot resolve. Unblock when better-auth widens that range.
      - dependency-name: better-sqlite3
        update-types: [version-update:semver-major]
      #  - eslint 10: the react / import / jsx-a11y plugins bundled by
      #    eslint-config-next only support ESLint <= 9 (lint crashes on load).
      #    Unblock when eslint-config-next supports ESLint 10.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      #  - FullCalendar 7: breaking API/type changes in components/EventCalendar.tsx,
      #    and all @fullcalendar/* packages must move together. Planned migration.
      - dependency-name: '@fullcalendar/*'
        update-types: [version-update:semver-major]
      # Keep Node type definitions on the runtime we actually deploy with
      # (Vercel + CI run Node 22); bump deliberately alongside the engine.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
